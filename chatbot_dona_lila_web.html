<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doña Lila Express - Sistema Inteligente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        .typing-dot { animation: bounce 1.4s infinite; }
        .typing-dot:nth-child(2) { animation-delay: .2s; }
        .typing-dot:nth-child(3) { animation-delay: .4s; }
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); opacity: .4; }
            30%            { transform: translateY(-4px); opacity: 1; }
        }
        .msg-in { animation: slideIn .18s ease-out; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-100 h-screen w-full flex flex-col overflow-hidden">

<!-- ═══ HEADER ════════════════════════════════════════════════════════════ -->
<header class="bg-white border-b h-16 flex items-center justify-between px-6 z-20 flex-shrink-0">
    <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-full bg-green-500 flex items-center justify-center text-white font-bold text-sm select-none">DL</div>
        <div>
            <p class="text-sm font-bold text-slate-800 leading-tight">Doña Lila Express</p>
            <p class="text-xs text-green-500 font-medium">● En línea</p>
        </div>
    </div>
    <span class="hidden lg:block text-xs text-slate-400 font-medium">Panel de Administración</span>
</header>

<main class="flex-1 flex overflow-hidden">

<!-- ═══ CHAT ═══════════════════════════════════════════════════════════════ -->
<section class="w-full lg:w-[420px] flex-shrink-0 flex flex-col border-r bg-white">

    <!-- Messages -->
    <div id="chatMessages" class="flex-1 overflow-y-auto p-4 flex flex-col gap-3"></div>

    <!-- AI quick-action buttons -->
    <div class="px-4 py-2 border-t bg-white flex gap-2">
        <button onclick="aiAction('sugerir')"
                class="flex-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 text-xs px-3 py-2 rounded-lg font-semibold transition-colors">
            ✨ Sugerir Maridaje
        </button>
        <button onclick="aiAction('resumir')"
                class="flex-1 bg-amber-50 hover:bg-amber-100 text-amber-600 text-xs px-3 py-2 rounded-lg font-semibold transition-colors">
            📋 Resumir Pedido
        </button>
        <button onclick="clearChat()" title="Nueva conversación"
                class="bg-slate-50 hover:bg-slate-100 text-slate-400 text-xs px-3 py-2 rounded-lg transition-colors">
            <i class="fa-solid fa-trash-can"></i>
        </button>
    </div>

    <!-- Input bar -->
    <div class="px-4 py-3 bg-slate-50 border-t flex items-center gap-2">
        <input id="userInput" type="text" placeholder="Escribe tu mensaje…" autocomplete="off"
               class="flex-1 px-4 py-2.5 rounded-full border border-slate-200 bg-white text-sm
                      focus:outline-none focus:ring-2 focus:ring-green-300 focus:border-transparent">
        <button id="sendBtn" onclick="sendMessage()"
                class="bg-green-500 hover:bg-green-600 text-white rounded-full w-10 h-10
                       flex items-center justify-center transition-colors">
            <i class="fa-solid fa-paper-plane text-sm"></i>
        </button>
    </div>
</section>

<!-- ═══ ADMIN PANEL ════════════════════════════════════════════════════════ -->
<section class="hidden lg:flex flex-1 flex-col bg-slate-50 overflow-y-auto">

    <!-- Sticky sub-header -->
    <div class="sticky top-0 z-10 bg-white border-b px-6 py-4">
        <p class="font-bold text-slate-800">Panel de Administración</p>
        <p class="text-xs text-slate-400 mt-0.5">Doña Lila Express — Menú y estadísticas</p>
    </div>

    <div class="p-6 flex flex-col gap-6">

        <!-- Stats -->
        <div class="grid grid-cols-3 gap-4">
            <div class="bg-white rounded-xl border p-4 text-center shadow-sm">
                <p id="statMsgs" class="text-2xl font-bold text-green-500">0</p>
                <p class="text-xs text-slate-500 mt-1">Mensajes</p>
            </div>
            <div class="bg-white rounded-xl border p-4 text-center shadow-sm">
                <p class="text-2xl font-bold text-indigo-500">18</p>
                <p class="text-xs text-slate-500 mt-1">Ítems en menú</p>
            </div>
            <div class="bg-white rounded-xl border p-4 text-center shadow-sm">
                <p class="text-2xl font-bold text-amber-500">5</p>
                <p class="text-xs text-slate-500 mt-1">Categorías</p>
            </div>
        </div>

        <!-- Full menu -->
        <div>
            <p class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-3">Menú Completo</p>
            <div id="menuContainer" class="flex flex-col gap-4"></div>
        </div>

    </div>
</section>

</main>

<script>
// ─── Config ───────────────────────────────────────────────────────────────────
const API_KEY = ""; // ← pon tu clave Gemini aquí
const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${API_KEY}`;

// ─── Menu (fuente única de verdad) ────────────────────────────────────────────
const MENU = [
    {
        id: "yaroas", label: "🫔 Yaroas", color: "yellow",
        items: [
            { name: "Yaroa de pollo con papa",           prices: { Pequeña:200, Mediana:300, Grande:400 } },
            { name: "Yaroa de res con papa",             prices: { Pequeña:250, Mediana:350, Grande:450 } },
            { name: "Yaroa de pollo con plátano maduro", prices: { Pequeña:250, Mediana:350, Grande:450 } },
            { name: "Yaroa de res con plátano maduro",   prices: { Pequeña:295, Mediana:395, Grande:495 } },
            { name: "Yaroa mixta",                       prices: { Pequeña:295, Mediana:395, Grande:495 } },
        ],
    },
    {
        id: "pizzas", label: "🍕 Pizzas", color: "red",
        note: "+RD$100 por ingrediente adicional",
        items: [
            { name: "Pizza pequeña (4 pzs)",  prices: { Pepperoni:250, Jamón:250, Completa:295 } },
            { name: "Pizza mediana (8 pzs)",  prices: { Pepperoni:385, Jamón:385, Completa:525 } },
            { name: "Pizza grande (12 pzs)",  prices: { Pepperoni:600, Jamón:600, Completa:700 } },
        ],
    },
    {
        id: "favoritos", label: "⭐ Favoritos", color: "orange",
        items: [
            { name: "Club sándwich con papa", price: 300 },
            { name: "Pechurina con papa",     price: 300 },
            { name: "Alitas",                 price: 450 },
            { name: "Carne salada",           price: 450 },
        ],
    },
    {
        id: "especialidades", label: "👨‍🍳 Especialidades", color: "purple",
        items: [
            { name: "Mofongo de camarones",  price: 450 },
            { name: "Camarones a la crema",  price: 450 },
        ],
    },
    {
        id: "bebidas", label: "🥤 Bebidas", color: "blue",
        items: [
            { name: "Batidas (lechosa, zapote, fresa…)", price: 150 },
            { name: "Jugos naturales",                   price: 100 },
            { name: "Refresco pequeño",                  price: 30  },
            { name: "Refresco mediano",                  price: 75  },
            { name: "Refresco grande",                   price: 100 },
            { name: "Refresco jumbo",                    price: 150 },
            { name: "Agua",                              price: 20  },
        ],
    },
];

// Auto-generate plain-text menu for the AI prompt
const MENU_TEXT = MENU.map(cat => {
    const rows = cat.items.map(item =>
        item.prices
            ? `${item.name}: ${Object.entries(item.prices).map(([k,v]) => `${k} RD$${v}`).join(', ')}`
            : `${item.name}: RD$${item.price}`
    ).join('; ');
    return `${cat.label}: ${rows}`;
}).join(' | ');

const SYSTEM_PROMPT =
    `Eres el asistente de Doña Lila Express, restaurante dominicano de comida rápida. ` +
    `Habla siempre en español dominicano, de forma amable y concisa. ` +
    `Cuando el cliente pida yaroa o pizza pregunta el tamaño antes de confirmar. ` +
    `Recoge siempre: nombre del cliente, dirección (si es delivery) y monto de cambio si paga en efectivo. ` +
    `Política: pedidos confirmados no se cancelan, solo se añaden ítems. ` +
    `Menú: ${MENU_TEXT}`;

// ─── State ────────────────────────────────────────────────────────────────────
let history  = []; // Gemini multi-turn format: [{role, parts}]
let msgCount = 0;
let busy     = false;

// ─── DOM refs ─────────────────────────────────────────────────────────────────
const chatEl   = document.getElementById('chatMessages');
const inputEl  = document.getElementById('userInput');
const sendEl   = document.getElementById('sendBtn');
const statMsgs = document.getElementById('statMsgs');

// ─── Message helpers ──────────────────────────────────────────────────────────
function bubble(text, side, avatarClass, bubbleClass) {
    const wrap = document.createElement('div');
    wrap.className = `flex items-end gap-2 msg-in ${side === 'right' ? 'flex-row-reverse' : ''}`;

    if (avatarClass) {
        const av = document.createElement('div');
        av.className = `w-7 h-7 rounded-full flex items-center justify-center text-white text-xs font-bold flex-shrink-0 ${avatarClass}`;
        av.textContent = side === 'ai' ? '✨' : 'DL';
        wrap.appendChild(av);
    }

    const bub = document.createElement('div');
    bub.className = `max-w-[85%] px-4 py-2.5 rounded-2xl text-sm leading-relaxed whitespace-pre-wrap ${bubbleClass}`;
    bub.textContent = text;
    wrap.appendChild(bub);

    chatEl.appendChild(wrap);
    chatEl.scrollTop = chatEl.scrollHeight;
    return wrap;
}

const botMsg  = t => bubble(t, 'left',  'bg-green-500',  'bg-slate-100 text-slate-800 rounded-bl-sm');
const userMsg = t => bubble(t, 'right', '',              'bg-green-500 text-white rounded-br-sm');
const aiMsg   = t => bubble(t, 'ai',   'bg-purple-500', 'bg-purple-50 border border-purple-200 text-slate-800 rounded-bl-sm');

function showTyping() {
    const wrap = document.createElement('div');
    wrap.id = 'typing';
    wrap.className = 'flex items-end gap-2';
    wrap.innerHTML = `
        <div class="w-7 h-7 rounded-full bg-green-500 flex items-center justify-center text-white text-xs font-bold flex-shrink-0">DL</div>
        <div class="bg-slate-100 px-4 py-3 rounded-2xl rounded-bl-sm flex gap-1 items-center">
            <span class="typing-dot w-1.5 h-1.5 bg-slate-400 rounded-full"></span>
            <span class="typing-dot w-1.5 h-1.5 bg-slate-400 rounded-full"></span>
            <span class="typing-dot w-1.5 h-1.5 bg-slate-400 rounded-full"></span>
        </div>`;
    chatEl.appendChild(wrap);
    chatEl.scrollTop = chatEl.scrollHeight;
}
const hideTyping = () => document.getElementById('typing')?.remove();

function setLoading(on) {
    busy = on;
    inputEl.disabled = on;
    sendEl.disabled  = on;
    sendEl.className = on
        ? 'bg-slate-200 text-slate-400 rounded-full w-10 h-10 flex items-center justify-center cursor-not-allowed'
        : 'bg-green-500 hover:bg-green-600 text-white rounded-full w-10 h-10 flex items-center justify-center transition-colors';
}

// ─── Gemini API ───────────────────────────────────────────────────────────────
async function callGemini(systemOverride, extraContents) {
    const payload = {
        system_instruction: { parts: [{ text: systemOverride ?? SYSTEM_PROMPT }] },
        contents: extraContents ?? history,
    };
    const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    return data.candidates?.[0]?.content?.parts?.[0]?.text?.trim() ?? 'Sin respuesta.';
}

// ─── Actions ──────────────────────────────────────────────────────────────────
async function sendMessage() {
    if (busy) return;
    const text = inputEl.value.trim();
    if (!text) return;

    inputEl.value = '';
    userMsg(text);
    statMsgs.textContent = ++msgCount;

    history.push({ role: 'user', parts: [{ text }] });
    setLoading(true);
    showTyping();

    try {
        const reply = await callGemini();
        hideTyping();
        botMsg(reply);
        history.push({ role: 'model', parts: [{ text: reply }] });
        statMsgs.textContent = ++msgCount;
    } catch {
        hideTyping();
        botMsg('Lo siento, hubo un problema de conexión. Intenta de nuevo.');
    } finally {
        setLoading(false);
        inputEl.focus();
    }
}

async function aiAction(type) {
    if (busy) return;
    if (!history.length) {
        aiMsg('Primero inicia una conversación para usar esta función.');
        return;
    }

    const histText = history.map(m => `${m.role === 'user' ? 'Cliente' : 'Bot'}: ${m.parts[0].text}`).join('\n');
    const prompt = type === 'sugerir'
        ? `Sugiere brevemente una bebida o acompañante ideal del menú basándote en el pedido.\nHistorial:\n${histText}`
        : `Genera un resumen estructurado del pedido: cliente, dirección, ítems con precio y total estimado.\nHistorial:\n${histText}`;

    const sys = type === 'sugerir'
        ? 'Eres un sommelier de comida rápida dominicana. Sé breve y usa el menú proporcionado.'
        : 'Eres un asistente de restaurante. Genera resúmenes de pedido claros y bien formateados.';

    setLoading(true);
    showTyping();
    try {
        const reply = await callGemini(sys, [{ role: 'user', parts: [{ text: prompt }] }]);
        hideTyping();
        aiMsg(reply);
    } catch {
        hideTyping();
        aiMsg('Error al procesar. Intenta de nuevo.');
    } finally {
        setLoading(false);
    }
}

function clearChat() {
    if (history.length && !confirm('¿Limpiar el chat y empezar de cero?')) return;
    history  = [];
    msgCount = 0;
    chatEl.innerHTML = '';
    statMsgs.textContent = 0;
    initWelcome();
}

function initWelcome() {
    botMsg('¡Hola! 👋 Bienvenido a Doña Lila Express ❤️\nRápido, rico y hecho para ti. ¿Qué deseas ordenar hoy?');
}

// ─── Menu render ──────────────────────────────────────────────────────────────
const COLORS = {
    yellow: { header: 'bg-yellow-50 border-yellow-100 text-yellow-800' },
    red:    { header: 'bg-red-50 border-red-100 text-red-800'         },
    orange: { header: 'bg-orange-50 border-orange-100 text-orange-800'},
    purple: { header: 'bg-purple-50 border-purple-100 text-purple-800'},
    blue:   { header: 'bg-blue-50 border-blue-100 text-blue-800'      },
};

function renderMenu() {
    const container = document.getElementById('menuContainer');

    MENU.forEach(cat => {
        const card = document.createElement('div');
        card.className = 'bg-white rounded-xl border shadow-sm overflow-hidden';

        // Category header
        const hdr = document.createElement('div');
        hdr.className = `px-4 py-2.5 border-b font-bold text-sm ${COLORS[cat.color].header}`;
        hdr.textContent = cat.label + (cat.note ? ` — ${cat.note}` : '');
        card.appendChild(hdr);

        // Items
        const body = document.createElement('div');
        body.className = 'divide-y';

        cat.items.forEach(item => {
            const row = document.createElement('div');
            row.className = 'px-4 py-2.5 flex items-start justify-between gap-4 hover:bg-slate-50 transition-colors';

            const nameEl = document.createElement('p');
            nameEl.className = 'text-sm text-slate-700';
            nameEl.textContent = item.name;

            const priceCol = document.createElement('div');
            priceCol.className = 'text-right flex-shrink-0';

            if (item.prices) {
                Object.entries(item.prices).forEach(([size, price]) => {
                    const p = document.createElement('p');
                    p.className = 'text-xs text-slate-500';
                    p.textContent = `${size}: RD$${price}`;
                    priceCol.appendChild(p);
                });
            } else {
                const p = document.createElement('p');
                p.className = 'text-sm font-semibold text-green-600';
                p.textContent = `RD$${item.price}`;
                priceCol.appendChild(p);
            }

            row.appendChild(nameEl);
            row.appendChild(priceCol);
            body.appendChild(row);
        });

        card.appendChild(body);
        container.appendChild(card);
    });
}

// ─── Init ─────────────────────────────────────────────────────────────────────
window.onload = () => {
    renderMenu();
    initWelcome();
    inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
};
</script>
</body>
</html>
